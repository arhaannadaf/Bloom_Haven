
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="reg.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script> <!-- Password strength library -->
</head>
<body>

    <div>
        <h2>Registration Form</h2>

        <form action="registration.php" method="POST">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" required>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <input type="checkbox" id="show-password" onclick="togglePasswordVisibility()"> Show Password

            <div id="password-strength" style="margin-top: 5px;"></div>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <input type="submit" value="Register">
        </form>

        <h3>Or sign up with:</h3>

        <!-- Social login buttons (images) -->
        <div class="social-login-buttons">
            <a href="#" id="google-login">
                <img src="gmail.png" alt="Login with Google">
            </a>
            <a href="#" id="facebook-login">
                <img src="facebook.svg" alt="Login with Facebook">
            </a>
            <a href="#" id="twitter-login">
                <img src="twitter.jpg" alt="Login with Twitter">
            </a>
        </div>
        <div class="register-link">
            <p>Have an account? <a href="log.html"> Log in</a></p>
        </div>
    </div>
<script src="reg.js"></script>


</body>
</html>
